<!-- title -->
<div class="w-full">
  <h1 class="text-xl font-bold text-white">Manage Users</h1>
</div>

<!-- Section: create a new user -->
<div class="bg-bg-surface border border-border-subtle rounded-lg p-6 mt-4">
  <form (ngSubmit)="createUser()">
    <fieldset class="mb-6">
      <legend class="flex items-center gap-2 text-[0.6rem] text-text-muted uppercase tracking-widest mb-3">
        <span class="mdi mdi-account-plus-outline text-sm"></span>
        New User
      </legend>
      <div class="grid grid-cols-2 gap-3">

        <div class="flex flex-col gap-1 col-span-2">
          <label for="new-email" class="text-[0.7rem] text-text-secondary">Email Address <span class="text-red-500/70">*</span></label>
          <div class="relative">
            <span class="mdi mdi-email-outline absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-sm pointer-events-none"></span>
            <input
              [(ngModel)]="newEmail"
              id="new-email"
              name="newEmail"
              type="email"
              placeholder="user@example.com"
              class="w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded pl-8 pr-3 py-2 text-[0.8rem] text-text-primary placeholder:text-text-disabled transition-colors duration-150"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label for="new-firstname" class="text-[0.7rem] text-text-secondary">Firstname <span class="text-red-500/70">*</span></label>
          <input
            [(ngModel)]="newFirstname"
            id="new-firstname"
            name="newFirstname"
            type="text"
            placeholder="Firstname"
            class="w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 text-[0.8rem] text-text-primary placeholder:text-text-disabled transition-colors duration-150"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="new-lastname" class="text-[0.7rem] text-text-secondary">Lastname <span class="text-red-500/70">*</span></label>
          <input
            [(ngModel)]="newLastname"
            id="new-lastname"
            name="newLastname"
            type="text"
            placeholder="Lastname"
            class="w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 text-[0.8rem] text-text-primary placeholder:text-text-disabled transition-colors duration-150"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="new-role" class="text-[0.7rem] text-text-secondary">Role <span class="text-red-500/70">*</span></label>
          <div class="relative">
            <select
              [(ngModel)]="newRole"
              id="new-role"
              name="newRole"
              class="w-full appearance-none bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 pr-8 text-[0.8rem] text-text-primary transition-colors duration-150 cursor-pointer">
              <option value="" disabled class="text-text-disabled">Select Role</option>
              @for (role of roles; track role) {
                <option [value]="role">{{ role }}</option>
              }
            </select>
            <span class="mdi mdi-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-text-muted text-sm pointer-events-none"></span>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label for="new-password" class="text-[0.7rem] text-text-secondary">Password <span class="text-red-500/70">*</span></label>
          <div class="relative">
            <span class="mdi mdi-lock-outline absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-sm pointer-events-none"></span>
            <input
              [(ngModel)]="newPassword"
              id="new-password"
              name="newPassword"
              type="password"
              placeholder="Password"
              class="w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded pl-8 pr-3 py-2 text-[0.8rem] text-text-primary placeholder:text-text-disabled transition-colors duration-150"
            />
          </div>
        </div>

      </div>
    </fieldset>

    <div class="flex justify-end pt-4 border-t border-border-subtle">
      <button
        type="submit"
        class="flex items-center gap-1.5 px-4 py-2 rounded text-[0.7rem] font-medium bg-[#1a2a3a] border border-[#2e4a6e] text-[#7ab0e0] hover:bg-[#1e3248] hover:border-[#3d6090] transition-all duration-150"
      >
        <span class="mdi mdi-account-plus-outline text-sm"></span>
        Create
      </button>
    </div>
  </form>
</div>

<!-- Section: users list -->
<div class="bg-bg-surface border border-border-subtle rounded-lg p-6 mt-4">
  <fieldset>
    <legend class="flex items-center gap-2 text-[0.6rem] text-text-muted uppercase tracking-widest mb-3">
      <span class="mdi mdi-account-group-outline text-sm"></span>
      Users List
    </legend>

    <!-- Loading state -->
    @if (isLoading) {
      <div class="flex items-center justify-center py-12 text-text-muted">
        <span class="mdi mdi-loading mdi-spin text-xl mr-2"></span>
        <p class="text-[0.7rem]">Loading users...</p>
      </div>
    }

    @if (!isLoading) {
      <!-- column labels -->
      <div class="grid grid-cols-12 gap-2 mb-2">
        <p class="col-span-3 text-[0.6rem] text-text-muted uppercase tracking-widest font-medium">Email</p>
        <p class="col-span-2 text-[0.6rem] text-text-muted uppercase tracking-widest font-medium">Firstname</p>
        <p class="col-span-2 text-[0.6rem] text-text-muted uppercase tracking-widest font-medium">Lastname</p>
        <p class="col-span-2 text-[0.6rem] text-text-muted uppercase tracking-widest font-medium">Role</p>
        <p class="col-span-2 text-[0.6rem] text-text-muted uppercase tracking-widest font-medium">New Password</p>
        <p class="col-span-1 text-[0.6rem] text-text-muted uppercase tracking-widest font-medium text-right">Actions</p>
      </div>

      <div class="flex flex-col gap-2">
        @for (user of users; track user.id) {
          <div class="grid grid-cols-12 gap-2 items-center">
            <input
              [(ngModel)]="user.email"
              type="email"
              class="col-span-3 w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 text-[0.8rem] text-text-primary transition-colors duration-150"
            />
            <input
              [(ngModel)]="user.firstname"
              type="text"
              class="col-span-2 w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 text-[0.8rem] text-text-primary transition-colors duration-150"
            />
            <input
              [(ngModel)]="user.lastname"
              type="text"
              class="col-span-2 w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 text-[0.8rem] text-text-primary transition-colors duration-150"
            />
            <!-- the update route does not support changing the role, shown read-only -->
            <input
              [value]="user.role"
              type="text"
              readonly
              class="col-span-2 w-full bg-bg-base border border-border-subtle rounded px-3 py-2 text-[0.8rem] text-text-muted cursor-default"
            />
            <!-- blank unless the staff wants to set a new password -->
            <input
              [(ngModel)]="user.password"
              type="password"
              placeholder="unchanged"
              class="col-span-2 w-full bg-bg-base border border-border-default hover:border-border-strong focus:border-border-strong focus:outline-none rounded px-3 py-2 text-[0.8rem] text-text-primary placeholder:text-text-disabled transition-colors duration-150"
            />

            <div class="col-span-1 flex items-center justify-end gap-1">
              <button
                type="button"
                (click)="deleteUser(user)"
                title="Delete user"
                class="w-7 h-7 flex items-center justify-center rounded text-text-muted hover:text-red-400/80 hover:bg-red-500/10 transition-all duration-100"
              >
                <span class="mdi mdi-trash-can-outline text-base"></span>
              </button>
              <button
                type="button"
                (click)="modifyUser(user)"
                title="Apply modifications"
                class="w-7 h-7 flex items-center justify-center rounded text-text-muted hover:text-[#4db864] hover:bg-green-500/10 transition-all duration-100"
              >
                <span class="mdi mdi-content-save-outline text-base"></span>
              </button>
            </div>
          </div>
        } @empty {
          <p class="text-[0.7rem] text-text-muted italic">No users found.</p>
        }
      </div>
    }
  </fieldset>
</div>
