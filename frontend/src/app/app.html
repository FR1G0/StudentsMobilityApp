<div class="text-base min-h-screen bg-bg-base text-text-primary">
  <input id="sidebar-toggle" type="checkbox" class="peer sr-only" />

  <div class="flex min-h-screen">
    <aside class="flex flex-col w-64 shrink-0 overflow-hidden border-r bg-bg-surface border-border-subtle transition-all duration-200 peer-checked:w-16" >
        <div class="text-lg font-bold flex h-12 items-center justify-start p-4">
          Students Mobility App
        </div>
        <ul class="flex flex-col gap-2 px-4">
          @for(link of links; track link.href) {
            <li>
              <a [href]="link.href" class="flex items-center rounded-sm px-2 text-sm text-text-secondary">
                <span class="text-lg {{link.icon}} pe-2"></span>
                <p>{{link.text}}</p>
              </a>
            </li>
          }
        </ul>
        <div class="mt-auto p-4 grid grid-cols-[auto_auto_1fr] items-center gap-2">
          <img src="/pfp.webp" class="w-8 h-8 bg-white rounded-full" />
          <!-- todo: add logout popup -->
          <div class="flex flex-col">
            <span class="text-sm font-medium">user name</span>
            <span class="text-xs text-text-secondary">role</span>
          </div>
          <button class="text-xs ml-auto text-text-secondary hover:text-text-primary w-min p-1 rounded-sm border border-text-disabled">logout</button>
        </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-12 items-center justify-between border-b bg-bg-surface border-bg-raised px-4" > title </header>
        <main class="flex-1 overflow-auto p-4">
            <router-outlet></router-outlet>
        </main>
    </div>
  </div>
</div>
